name: Build Installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pyinstaller pystray pillow pywinauto requests comtypes

- name: Build executable
        run: |
          # Spec-File nutzen (zuverlässige DLL-Einbindung)
          pyinstaller Telefonerkennung.spec
          # python312.dll für Installer separat bereitstellen (neben EXE im App-Ordner)
          $pythonExe = (Get-Command python).Source
          $pythonDll = Join-Path (Split-Path $pythonExe) "python312.dll"
          if (Test-Path $pythonDll) {
            Copy-Item $pythonDll -Destination "dist\python312.dll" -Force
            Write-Host "python312.dll nach dist kopiert: $pythonDll"
          } else {
            # Fallback: in Python-Installationsverzeichnis suchen
            $altDll = Join-Path $env:PYTHON_HOME "python312.dll"
            if (Test-Path $altDll) {
              Copy-Item $altDll -Destination "dist\python312.dll" -Force
              Write-Host "python312.dll aus PYTHON_HOME kopiert: $altDll"
            } else {
              Write-Error "python312.dll nicht gefunden! Weder bei python.exe noch in PYTHON_HOME."
              exit 1
            }
          }

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile installer
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$version installer.iss

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Telefonerkennung-Setup-*.exe
          generate_release_notes: true
