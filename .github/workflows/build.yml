name: Build Installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pyinstaller pystray pillow pywinauto requests comtypes

      - name: Build executable
        run: |
          # Python-DLL explizit einbinden (Fix: "failed to load pythondll")
          $pythonDll = (Get-Command python).Source
          $pythonDllDir = Split-Path $pythonDll
          $dllName = "python312.dll"
          $dllPath = Join-Path $pythonDllDir $dllName
          if (Test-Path $dllPath) {
            pyinstaller --onefile --windowed --icon=telefon.ico --name Telefonerkennung --add-binary "$dllPath;." telefonerkennung.py
          } else {
            Write-Warning "DLL $dllPath nicht gefunden, baue ohne explizites Einbinden"
            pyinstaller --onefile --windowed --icon=telefon.ico --name Telefonerkennung telefonerkennung.py
          }

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile installer
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$version installer.iss

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Telefonerkennung-Setup-*.exe
          generate_release_notes: true
