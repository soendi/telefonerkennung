name: Build Installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pyinstaller pystray pillow pywinauto requests comtypes

      - name: Build executable
        run: |
          # Python-DLL explizit einbinden (Fix: "failed to load pythondll")
          # DLL-Name dynamisch ermitteln (python312.dll, python311.dll, etc.)
          $pythonExe = (Get-Command python).Source
          $pythonDllDir = Split-Path $pythonExe
          $dllFiles = Get-ChildItem $pythonDllDir -Filter "python*.dll" | Where-Object { $_.Name -match '^python\d+\.dll$' }
          $addBinaryArgs = @()
          foreach ($dll in $dllFiles) {
            $addBinaryArgs += "--add-binary", "$($dll.FullName);."
          }
          pyinstaller --onefile --windowed --icon=telefon.ico --name Telefonerkennung $addBinaryArgs telefonerkennung.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile installer
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$version installer.iss

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Telefonerkennung-Setup-*.exe
          generate_release_notes: true
